<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lists</title>
  <style>
   body {
      align-items: center;
      align-content: center;
      justify-content: center;
      text-align: center;
      background-color: rgb(35, 35, 35);
      font-size: 48px;
      color: salmon;
      font-family: sans-serif;
      font-weight: bold;
    }

    table {
      border: 5px;
    }
  </style>
</head>

<body>

      <li>Ferrari</li>

      <td>Triumph</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Xtreme 250R</td>
      <td>Hero</td>
    </tr>
    <tr>
      <td>3</td>
      <td>Adv 390</td>
      <td>Ktm</td>
    </tr>
    <tr>
      <td>4</td>
      <td>Himalayan 411</td>
      <td>Royal Enfield</td>
    </tr>
  </table>
</body>

</html>
