      // alert("Resetting Form.");

<body>
  <header>
    <h1 id="title">Registration Form</h1>
    <nav>
      <a href="https://www.google.com" target="_blank"> Google </a>
      <a href="https://www.amazon.in" target="_blank"> Amazon </a>
      <a href="https://www.youtube.com" target="_blank"> Youtube </a>
    </nav>
  </header>
  <br>
  <form action="/push" method="post">
    <label for="name">Name</label>
    <input type="text" name="name" id="name" placeholder="Ravendra Yadav"> <br>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required pattern="[^ @]*@[^ @]*"
      placeholder="ravnedrayadav@gmail.com"><br>
    <label for="phone"> Phone </label>
    <input type="number" id="phone" name="phone" placeholder="+918103534903" required pattern="^[0-9-+\s()]*$"
      maxLength="16" minLength="6"> <br>
    <label for="passwd"><strong>Password</strong></label>
    <input type="password" name="passwd" id="passwd"> <br>
    <label for="date"> Date </label>
    <input type="date" name="date" id="date"><br>
    <label for="time"> Time </label>
    <input type="time" name="time" id="time"> <br>
    <label for="file"> Upload </label>
    <input type="file" name="file" id="file">

    <br>
    <input type="search" name="s" id="">
    <option value="java" name="s"></option>
    <label for="text">Feedback</label>
    <textarea name="text" id="text" cols="30" rows="3"></textarea>
    <br> <br>
    <button type="submit">Submit</button>
    <button type="reset" onclick="pop()">Reset</button>
  </form>

  <div name="math" class="math">
    <h2>Formula for (a+b)<sup>2</sup> = a<sup>2</sup>+b<sup>2</sup>+2ab</h2>
    <h2>Formula for water = H<sub>2</sub>O</h2>
  </div>
